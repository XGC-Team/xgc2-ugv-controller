# Isolated ROS transport / kinematic fixture, not a vehicle dynamics model: a Scout
# (declared slip/lag envelope) and a Mecanum under one coordinator.
frequency: 50.0
input_timeout: 0.15
state_timeout: 1.0
world_frame: world
scene_namespace: /reset_pair/scene
clearance: 0.08
uncertainty_margin: 0.05
fence: {x_min: -3.0, x_max: 3.0, y_min: -3.0, y_max: 3.0}
robots:
  - namespace: ugv1
    type: scout
    length: 0.90
    width: 0.80
    lateral_velocity_per_yaw_bound: 0.25
    body_offset_x: 0.0
    body_offset_y: 0.0
    max_vx: 0.35
    max_vy: 0.0
    max_omega: 0.5
    accel_vx: 0.35
    accel_vy: 0.35
    accel_omega: 0.6
  - namespace: ugv2
    type: mecanum
    length: 0.41
    width: 0.36
    lateral_velocity_per_yaw_bound: 0.0
    body_offset_x: 0.0
    body_offset_y: 0.0
    max_vx: 0.35
    max_vy: 0.35
    max_omega: 0.5
    accel_vx: 0.35
    accel_vy: 0.35
    accel_omega: 0.6
