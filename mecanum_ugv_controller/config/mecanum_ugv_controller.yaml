# Complete node configuration. Launch loads this file without parameter overrides.
auto_start_tracking: false
cmd_vel_topic: cmd_vel
command_publish_rate_hz: 30.0
control_rate_hz: 500.0
fence:
  x_max: 20.0
  x_min: -20.0
  y_max: 20.0
  y_min: -20.0
heading_target_yaw: 0.0
idle_cmd_rate_hz: 5.0
max_linear_speed: 1.0
max_yaw_rate: 1.0
pose_topic: pose
queue_size: 10
reference_twist_topic: alg/reference/twist
reset:
  # T14: the total Reset timeout is 90 s for every vehicle.
  timeout: 90.0
  # What the vehicle declares to the Reset coordinator (the Wheeltec chassis 0.41 x 0.36 m plus
  # 0.14 m per side), and the limits its Reset tracker obeys.
  footprint:
    length: 0.69
    width: 0.64
    offset_x: 0.0
    offset_y: 0.0
  limits:
    max_linear_speed: 0.35
    max_yaw_rate: 0.5
    linear_acceleration: 0.35
    angular_acceleration: 0.6
reset_pose_topic: reset_pose
state_timeout: 0.5
status_publish_rate_hz: 5.0
track:
  kp_yaw: 1.2
