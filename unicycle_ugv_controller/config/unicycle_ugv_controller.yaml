control_rate_hz: 100.0
queue_size: 10

state_estimate_topic: "alg/state_estimator/state"
state_source: "state_estimator"
vrpn_pose_topic: "/vrpn_client_node/ugv1/pose"
vrpn_twist_topic: "/vrpn_client_node/ugv1/twist"
active_analytic_topic: "alg/unicycle_reference_trajectory/active/analytic"
active_polynomial_topic: "alg/unicycle_reference_trajectory/active/polynomial"
active_sampled_topic: "alg/unicycle_reference_trajectory/active/sampled"
cmd_vel_topic: "cmd_vel"

state_timeout: 0.2
reference_timeout: 0.5
command_publish_rate_hz: 100.0
auto_start_tracking: false

nmpc:
  control_period: 0.1
  prediction_horizon: 1.0
  request_rate_hz: 100.0
  solve_timeout: 0.05
  result_timeout: 0.1
  # Nonlinear LS weights. Read once at node start from this yaml / launch
  # args / rosparam. Change a value, restart the controller, then freeze
  # the keepers back into this file and the launch defaults.
  weights:
    position_x: 20.0
    position_y: 20.0
    yaw: 8.0
    speed: 4.0
    accel: 0.4
    omega: 10.0
    terminal_position_x: 60.0
    terminal_position_y: 60.0
    terminal_yaw: 20.0
    terminal_speed: 10.0

limits:
  min_linear_speed: -1.5
  max_linear_speed: 3.0
  max_angular_speed: 2.5
  max_linear_acceleration: 2.0
  # Shuttle rail uses signed v (reverse). Do not raise min_linear_speed to 0.
