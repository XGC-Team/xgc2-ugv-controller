name: Flatness measured-speed numerical regression
on:
  pull_request:
    paths:
      - 'unicycle_ugv_controller/src/common_types.cpp'
      - 'unicycle_ugv_controller/test/flatness_estimated_speed_test.py'
      - '.github/workflows/flatness-estimated-speed.yml'
permissions:
  contents: read
jobs:
  numerical-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 unicycle_ugv_controller/test/flatness_estimated_speed_test.py
