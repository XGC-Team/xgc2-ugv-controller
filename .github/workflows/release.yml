name: release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected .xgc2/product.yml version
        required: true
        type: string
      expected_source_sha:
        description: Expected source commit SHA
        required: true
        type: string
      publish_apt:
        description: Publish built debs to the XGC2 APT repository
        required: true
        default: false
        type: boolean
      run_cpp_quality:
        description: Run clang-format and clang-tidy checks
        required: true
        default: false
        type: boolean
      run_source_tests:
        description: Run source-tree catkin tests before Docker deb builds
        required: true
        default: false
        type: boolean

defaults:
  run:
    shell: bash

jobs:
  validate-release-inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate expected version and source SHA
        run: |
          set -euo pipefail
          actual_version="$(sed -n 's/^version:[[:space:]]*//p' .xgc2/product.yml | head -n 1)"
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_version}" = "${{ inputs.expected_version }}"
          test "${actual_sha}" = "${{ inputs.expected_source_sha }}"

  package-compliance:
    name: Fast package compliance
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check package metadata
        run: |
          git diff --check HEAD
          .xgc2/scripts/check_version_bump.sh --ci
          .xgc2/scripts/check_package_compliance.sh

  cpp-quality:
    name: C++ quality
    if: ${{ inputs.run_cpp_quality }}
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ros:melodic-ros-base-bionic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install quality dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          .xgc2/scripts/setup_xgc2_apt_source.sh
          apt-get install -y --no-install-recommends \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            git \
            libeigen3-dev \
            libxgc2-math-dev \
            libxgc2-state-machine-dev \
            python3-numpy \
            rsync \
            xgc2-acados \
            ros-melodic-geometry-msgs \
            ros-melodic-message-generation \
            ros-melodic-nav-msgs \
            ros-melodic-roscpp \
            ros-melodic-rospy \
            ros-melodic-std-msgs \
            ros-melodic-xgc2-estimator-rigid-state-msgs \
            ros-melodic-xgc2-unicycle-reference-trajectory-msgs \
            ros-melodic-xgc2-ros1-utils

      - name: Run C++ quality gate
        run: .xgc2/scripts/check_cpp_quality.sh

  source-tests:
    name: Source build and tests
    needs: validate-release-inputs
    runs-on: ubuntu-latest
    container: ros:melodic-ros-base-bionic
    steps:
      - name: Skip source tests
        if: ${{ !inputs.run_source_tests }}
        run: echo "Source tests disabled by input"

      - name: Install git for checkout
        if: inputs.run_source_tests
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4
        if: inputs.run_source_tests

      - name: Install build dependencies
        if: inputs.run_source_tests
        run: |
          export DEBIAN_FRONTEND=noninteractive
          .xgc2/scripts/setup_xgc2_apt_source.sh
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git \
            libeigen3-dev \
            libxgc2-math-dev \
            libxgc2-state-machine-dev \
            rsync \
            xgc2-acados \
            ros-melodic-geometry-msgs \
            ros-melodic-message-generation \
            ros-melodic-nav-msgs \
            ros-melodic-roscpp \
            ros-melodic-roslaunch \
            ros-melodic-rospack \
            ros-melodic-rospy \
            ros-melodic-rostest \
            ros-melodic-rosunit \
            ros-melodic-std-msgs \
            ros-melodic-xgc2-estimator-rigid-state-msgs \
            ros-melodic-xgc2-unicycle-reference-trajectory-msgs \
            ros-melodic-xgc2-ros1-utils

      - name: Build package and run launch compliance
        if: inputs.run_source_tests
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/xgc2-ugv-controller-compliance"
          install_root="${RUNNER_TEMP}/xgc2-ugv-controller-install-root"
          rm -rf "$work_dir" "$install_root"
          mkdir -p "$work_dir/src/xgc2-ugv-controller"
          rsync -a --delete "$GITHUB_WORKSPACE/" "$work_dir/src/xgc2-ugv-controller/"

          cd "$work_dir"
          set +u
          source /opt/ros/melodic/setup.bash
          set -u
          parallel_jobs="$(nproc)"
          PYTHONPATH="$work_dir/src/xgc2-ugv-controller/unicycle_ugv_controller/tools" \
            python3 -B -m unittest discover \
              -s "$work_dir/src/xgc2-ugv-controller/unicycle_ugv_controller/tools/unicycle_nmpc/tests" \
              -v
          catkin_make -j"${parallel_jobs}" -l"${parallel_jobs}" \
            run_tests_unicycle_reference_trajectory \
            run_tests_unicycle_ugv_controller
          catkin_test_results
          DESTDIR="$install_root" catkin_make -j"${parallel_jobs}" -l"${parallel_jobs}" install \
            -DCMAKE_INSTALL_PREFIX=/opt/ros/melodic \
            -DCMAKE_BUILD_TYPE=Release
          source devel/setup.bash
          test "$(rospack find unicycle_reference_trajectory)" = "$work_dir/src/xgc2-ugv-controller/unicycle_reference_trajectory"
          test "$(rospack find unicycle_ugv_controller)" = "$work_dir/src/xgc2-ugv-controller/unicycle_ugv_controller"
          roslaunch --files unicycle_reference_trajectory ugv_unicycle_reference_trajectory.launch >/tmp/xgc2-unicycle-reference-files.txt
          roslaunch --files unicycle_ugv_controller ugv_unicycle_nmpc_controller.launch >/tmp/xgc2-unicycle-controller-files.txt

  build-debs:
    name: Build debs (${{ matrix.arch }})
    needs: validate-release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check product version bump
        run: .xgc2/scripts/check_version_bump.sh --ci

      - name: Build and install-check deb package in Docker
        run: |
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-ugv-controller-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-ugv-controller-debs-${{ matrix.arch }}
          path: debs/*.deb

  publish-apt:
    name: Publish APT
    if: inputs.publish_apt
    needs: build-debs
    runs-on: ubuntu-latest
    env:
      APT_REPO_HOST: ${{ secrets.APT_REPO_HOST }}
      APT_REPO_PORT: ${{ secrets.APT_REPO_PORT }}
      APT_REPO_SSH_KEY: ${{ secrets.APT_REPO_SSH_KEY }}
      APT_REPO_KNOWN_HOSTS: ${{ secrets.APT_REPO_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - name: Download deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xgc2-ugv-controller-debs-*
          path: debs
          merge-multiple: true

      - name: Publish to self-hosted APT repository
        if: ${{ env.APT_REPO_HOST != '' && env.APT_REPO_PORT != '' && env.APT_REPO_SSH_KEY != '' && env.APT_REPO_KNOWN_HOSTS != '' }}
        run: .xgc2/scripts/publish_apt_repo.sh --deb-dir debs
